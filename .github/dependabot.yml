version: 2
updates:
  - package-ecosystem: "cargo"
    directories: ["/", "/node"]
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/node"
    schedule:
      interval: "monthly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
