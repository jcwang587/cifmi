[package]
name = "cifmi"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Reads CIF 1.1 and 2.0 files into crystal structures"
license = "MIT"
repository = "https://github.com/jcwang587/cifmi"
readme = "README.md"
keywords = ["cif", "crystallography", "crystal", "structure", "parser"]
categories = ["science", "parser-implementations"]
# The crate carries the Rust sources, the tests and their fixtures. The Node
# package, the development tooling and the macOS linker wrapper stay in the
# repository: a crate built from a registry has no tools/ directory for the
# wrapper that .cargo/config.toml names.
exclude = ["/.cargo", "/.github", "/.pre-commit-config.yaml", "/CONTRIBUTING.md", "/node", "/tools"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
pyo3 = { version = "0.29", optional = true, features = ["extension-module", "abi3-py310"] }
rustc-hash = "2.1"
thiserror = "2.0.18"

[features]
default = []
python = ["dep:pyo3"]

# Nothing is stripped, not even the debug information Cargo strips from
# release builds by default: stripping runs after the linker and can misalign
# a macOS library again after tools/macos-link has aligned it (see
# .cargo/config.toml).
[profile.release]
lto = true
codegen-units = 1
strip = "none"
